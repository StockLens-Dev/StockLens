name: ChatGPT Workspace

on:
  workflow_dispatch:
  push:
    branches:
      - orlando-pdf-module

permissions:
  contents: read

jobs:
  package-workspace:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package StockLens workspace
        run: |
          zip -r stocklens-orlando-workspace.zip .             -x ".git/*"             -x "stocklens-orlando-workspace.zip"

      - name: Upload workspace artifact
        uses: actions/upload-artifact@v4
        with:
          name: stocklens-orlando-workspace
          path: stocklens-orlando-workspace.zip
          if-no-files-found: error
          retention-days: 7
